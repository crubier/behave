[package]
name = "behave"
version = "0.1.0"
edition = "2021"

[dependencies]
capnp = "0.18"
iceoryx2 = "0.7"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
tokio = { version = "1", features = ["full"] }

# For semantic strings and related containers used by iceoryx2
iceoryx2_bb_container = { package = "iceoryx2-bb-container", version = "0.7" }
serde = "1"

[build-dependencies]
capnpc = "0.18"

[[bin]]
name = "robot"
path = "robot/main.rs"

[[bin]]
name = "node-sense"
path = "robot/nodes/sense/main.rs"

[[bin]]
name = "node-control"
path = "robot/nodes/control/main.rs"

[[bin]]
name = "node-behave"
path = "robot/nodes/behave/main.rs"

[[bin]]
name = "node-communicate"
path = "robot/nodes/communicate/main.rs"

[[bin]]
name = "mock-gcs"
path = "robot/mock_gcs.rs"
