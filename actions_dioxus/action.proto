syntax = "proto3";
package behave.actions;

import "takeoff/takeoff.proto";
import "land/land.proto";
import "goto_waypoint/goto.proto";
import "return_home/home.proto";
import "take_photo/photo.proto";
import "sequence/sequence.proto";
import "fallback/fallback.proto";
import "parallel/parallel.proto";

// ── Composed action types ───────────────────────────────────────
//
// Each message uses a oneof over all node-specific types, so a single
// ActionArgs / ActionResult / etc. can represent any node in the tree.

message ActionArgs {
    oneof action {
        behave.actions.takeoff.TakeoffArgs     takeoff  = 1;
        behave.actions.land.LandArgs           land     = 2;
        behave.actions.goto.GotoArgs           goto     = 3;
        behave.actions.home.HomeArgs           home     = 4;
        behave.actions.photo.PhotoArgs         photo    = 5;
        behave.actions.sequence.SequenceArgs   sequence = 6;
        behave.actions.fallback.FallbackArgs   fallback = 7;
        behave.actions.parallel.ParallelArgs   parallel = 8;
    }
}

message ActionOutput {
    oneof action {
        behave.actions.takeoff.TakeoffOutput     takeoff  = 1;
        behave.actions.land.LandOutput           land     = 2;
        behave.actions.goto.GotoOutput           goto     = 3;
        behave.actions.home.HomeOutput           home     = 4;
        behave.actions.photo.PhotoOutput         photo    = 5;
        behave.actions.sequence.SequenceOutput   sequence = 6;
        behave.actions.fallback.FallbackOutput   fallback = 7;
        behave.actions.parallel.ParallelOutput   parallel = 8;
    }
}

message ActionResult {
    oneof action {
        behave.actions.takeoff.TakeoffResult     takeoff  = 1;
        behave.actions.land.LandResult           land     = 2;
        behave.actions.goto.GotoResult           goto     = 3;
        behave.actions.home.HomeResult           home     = 4;
        behave.actions.photo.PhotoResult         photo    = 5;
        behave.actions.sequence.SequenceResult   sequence = 6;
        behave.actions.fallback.FallbackResult   fallback = 7;
        behave.actions.parallel.ParallelResult   parallel = 8;
    }
}

message ActionInput {
    oneof action {
        behave.actions.takeoff.TakeoffInput     takeoff  = 1;
        behave.actions.land.LandInput           land     = 2;
        behave.actions.goto.GotoInput           goto     = 3;
        behave.actions.home.HomeInput           home     = 4;
        behave.actions.photo.PhotoInput         photo    = 5;
        behave.actions.sequence.SequenceInput   sequence = 6;
        behave.actions.fallback.FallbackInput   fallback = 7;
        behave.actions.parallel.ParallelInput   parallel = 8;
    }
}

message ActionState {
    oneof action {
        behave.actions.takeoff.TakeoffState     takeoff  = 1;
        behave.actions.land.LandState           land     = 2;
        behave.actions.goto.GotoState           goto     = 3;
        behave.actions.home.HomeState           home     = 4;
        behave.actions.photo.PhotoState         photo    = 5;
        behave.actions.sequence.SequenceState   sequence = 6;
        behave.actions.fallback.FallbackState   fallback = 7;
        behave.actions.parallel.ParallelState   parallel = 8;
    }
}

// ── Tree structure ──────────────────────────────────────────────

// A node in the behavior tree. Wraps ActionArgs with an ID and children.
// This is the wire format: a GCS sends an ActionNode tree, the robot
// deserializes it and renders it as Dioxus elements.
message ActionNode {
    uint64 id = 1;
    ActionArgs args = 2;
    repeated ActionNode children = 3;
}

// ── Run record ──────────────────────────────────────────────────

enum RunStatus {
    RUN_STATUS_RUNNING   = 0;
    RUN_STATUS_SUCCEEDED = 1;
    RUN_STATUS_FAILED    = 2;
}

// A single execution record for a node, matching the Rust `Run` struct.
// This allows the entire run tree to be serialized as protobuf.
message Run {
    uint64    id         = 1;
    string    tag        = 2;
    uint64    started_at = 3;   // microseconds since epoch
    uint64    ended_at   = 4;   // 0 if still running
    RunStatus status     = 5;
    bytes     output     = 6;   // serialized ActionOutput
    bytes     result     = 7;   // serialized ActionResult
    bytes     state      = 8;   // serialized ActionState
    repeated Run children = 9;
}
