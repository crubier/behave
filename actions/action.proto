syntax = "proto3";
package behave.actions;

import "takeoff/takeoff.proto";
import "land/land.proto";
import "goto_waypoint/goto_waypoint.proto";
import "return_home/return_home.proto";
import "take_photo/take_photo.proto";
import "sequence/sequence.proto";
import "fallback/fallback.proto";
import "parallel/parallel.proto";
import "loop/loop.proto";
import "concurrent/concurrent.proto";

// ── Action type IDs ─────────────────────────────────────────────
//
// Each action type has a fixed numeric ID used as the protobuf field
// number in ALL five oneof unions (Args, Result, State, Input, Output).
// This ensures consistent identification across the wire.
//
//   sequence      = 2
//   fallback      = 3
//   takeoff       = 4
//   land          = 5
//   goto_waypoint = 6
//   return_home   = 7
//   take_photo    = 8
//   parallel      = 9
//   loop          = 10
//   concurrent    = 11

// ── Action args tree (the mission definition) ──────────────────

message ActionArgs {
  uint64 id = 1;
  oneof action {
    behave.actions.sequence.SequenceArgs sequence = 2;
    behave.actions.fallback.FallbackArgs fallback = 3;
    behave.actions.takeoff.TakeoffArgs takeoff = 4;
    behave.actions.land.LandArgs land = 5;
    behave.actions.goto_waypoint.GotoWaypointArgs goto_waypoint = 6;
    behave.actions.return_home.ReturnHomeArgs return_home = 7;
    behave.actions.take_photo.TakePhotoArgs take_photo = 8;
    behave.actions.parallel.ParallelArgs parallel = 9;
    behave.actions.loop_action.LoopArgs loop = 10;
    behave.actions.concurrent.ConcurrentArgs concurrent = 11;
  }
  repeated ActionArgs children = 20;
}

// ── Result union ────────────────────────────────────────────────

message ActionResult {
  oneof result {
    behave.actions.sequence.SequenceResult sequence = 2;
    behave.actions.fallback.FallbackResult fallback = 3;
    behave.actions.takeoff.TakeoffResult takeoff = 4;
    behave.actions.land.LandResult land = 5;
    behave.actions.goto_waypoint.GotoWaypointResult goto_waypoint = 6;
    behave.actions.return_home.ReturnHomeResult return_home = 7;
    behave.actions.take_photo.TakePhotoResult take_photo = 8;
    behave.actions.parallel.ParallelResult parallel = 9;
    behave.actions.loop_action.LoopResult loop = 10;
    behave.actions.concurrent.ConcurrentResult concurrent = 11;
  }
}

// ── State union ─────────────────────────────────────────────────

message ActionState {
  oneof state {
    behave.actions.sequence.SequenceState sequence = 2;
    behave.actions.fallback.FallbackState fallback = 3;
    behave.actions.takeoff.TakeoffState takeoff = 4;
    behave.actions.land.LandState land = 5;
    behave.actions.goto_waypoint.GotoWaypointState goto_waypoint = 6;
    behave.actions.return_home.ReturnHomeState return_home = 7;
    behave.actions.take_photo.TakePhotoState take_photo = 8;
    behave.actions.parallel.ParallelState parallel = 9;
    behave.actions.loop_action.LoopState loop = 10;
    behave.actions.concurrent.ConcurrentState concurrent = 11;
  }
}

// ── Input union ─────────────────────────────────────────────────

message ActionInput {
  oneof input {
    behave.actions.sequence.SequenceInput sequence = 2;
    behave.actions.fallback.FallbackInput fallback = 3;
    behave.actions.takeoff.TakeoffInput takeoff = 4;
    behave.actions.land.LandInput land = 5;
    behave.actions.goto_waypoint.GotoWaypointInput goto_waypoint = 6;
    behave.actions.return_home.ReturnHomeInput return_home = 7;
    behave.actions.take_photo.TakePhotoInput take_photo = 8;
    behave.actions.parallel.ParallelInput parallel = 9;
    behave.actions.loop_action.LoopInput loop = 10;
    behave.actions.concurrent.ConcurrentInput concurrent = 11;
  }
}

// ── Output union ────────────────────────────────────────────────

message ActionOutput {
  oneof output {
    behave.actions.sequence.SequenceOutput sequence = 2;
    behave.actions.fallback.FallbackOutput fallback = 3;
    behave.actions.takeoff.TakeoffOutput takeoff = 4;
    behave.actions.land.LandOutput land = 5;
    behave.actions.goto_waypoint.GotoWaypointOutput goto_waypoint = 6;
    behave.actions.return_home.ReturnHomeOutput return_home = 7;
    behave.actions.take_photo.TakePhotoOutput take_photo = 8;
    behave.actions.parallel.ParallelOutput parallel = 9;
    behave.actions.loop_action.LoopOutput loop = 10;
    behave.actions.concurrent.ConcurrentOutput concurrent = 11;
  }
}

// ── Run instance (a single execution of an ActionNode) ──────────

enum RunStatus {
  RUN_STATUS_PENDING = 0;
  RUN_STATUS_RUNNING = 1;
  RUN_STATUS_SUCCEEDED = 2;
  RUN_STATUS_FAILED = 3;
}

message ActionRun {
  uint64 run_id = 1;     // unique ID for this run instance
  ActionArgs args = 2;   // the action definition this run executes
  uint64 started_at = 3; // microseconds since epoch
  uint64 ended_at = 4;   // 0 if still running
  RunStatus status = 5;
  ActionResult result = 6;           // final data (set on completion)
  ActionState state = 7;             // internal state (for debugging)
  repeated ActionOutput outputs = 8; // all outputs sent so far (time series)
  repeated ActionInput inputs = 9;   // all inputs received so far (time series)
  repeated ActionRun children = 10;
  uint32 action_type_id = 11;       // protobuf field number shared across all oneofs (2-11)
}

// ── GCS <-> Behave envelope messages ────────────────────────────

// Route an input to specific ActionRun(s) in the tree.
// Targeting options (pick one):
//   action_type_id: route to all runs of that action type (field number 2-11)
//   action_id:      route to all runs originating from that ActionArgs.id
//   run_id:         route to a specific ActionRun by its run_id
message ActionInputEnvelope {
  oneof target {
    uint32 action_type_id = 1;
    uint64 action_args_id = 2;
    uint64 action_run_id = 3;
  }
  ActionInput input = 10;
}

// Streamed when an ActionRun completes (success or failure).
message ActionResultEnvelope {
  uint64 action_args_id = 1;  // from ActionArgs.id
  uint64 action_run_id = 2;   // from ActionRun.run_id
  RunStatus status = 3;
  ActionResult result = 4;
}

// Streamed when an ActionRun produces an output.
message ActionOutputEnvelope {
  uint64 action_args_id = 1;  // from ActionArgs.id
  uint64 action_run_id = 2;   // from ActionRun.run_id
  ActionOutput output = 3;
}
