syntax = "proto3";

package behaviors.sequence.v1;

import "google/protobuf/any.proto";

// Input arguments for sequence behavior
message SequenceArgument {
  repeated google.protobuf.Any children = 1;  // List of child behavior arguments
}

// Result of sequence execution
message SequenceResult {
  repeated google.protobuf.Any child_results = 1;  // Results from each child behavior
  bool success = 2;                                // Overall success status
  string error = 3;                                // Error message if any
}

// Current execution state for suspend/resume
message SequenceState {
  int32 current_index = 1;                         // Current child being executed
  repeated google.protobuf.Any child_states = 2;   // States of child behaviors
}

// Status information
message SequenceStatus {
  enum Phase {
    PHASE_UNSPECIFIED = 0;
    PHASE_INITIALIZING = 1;
    PHASE_RUNNING = 2;
    PHASE_SUSPENDED = 3;
    PHASE_COMPLETED = 4;
    PHASE_CANCELLED = 5;
    PHASE_FAILED = 6;
  }
  Phase phase = 1;
  int32 completed_count = 2;                       // Number of completed children
  repeated bool child_success = 3;                 // Success status of each child
  string status_message = 4;                       // Human-readable status
}

// Runtime metrics
message SequenceMetrics {
  int32 total_children = 1;                        // Total number of children
  float estimated_duration = 2;                    // Estimated execution time in seconds
  float estimated_memory_mb = 3;                   // Estimated memory usage in MB
  float success_probability = 4;                   // Estimated success probability
  repeated float child_durations = 5;              // Estimated duration for each child
}

// Input during execution
message SequenceInput {
  int32 target_child = 1;                         // Which child to route input to
  google.protobuf.Any child_input = 2;            // Input for the child
}

// Output during execution
message SequenceOutput {
  int32 source_child = 1;                         // Which child produced the output
  google.protobuf.Any child_output = 2;           // Output from the child
  SequenceStatus status = 3;                      // Current sequence status
}
